name: CI and deploy

on:
  pull_request:
  push:
    branches: [main, sandbox]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - name: Engine and function tests, bundles and shared UI in sync
        run: npm run check
      - name: Type-check the card and the page
        run: |
          for d in src/app/cards src/app/pages; do
            (cd "$d" && npm install --no-audit --no-fund && npx tsc --noEmit -p .)
          done

  # main deploys to the live account (profile prod), sandbox to the sandbox (profile sandbox).
  # Each account has its own GitHub environment holding that account's personal access key.
  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    environment: HUBSPOT_PERSONAL_ACCESS_KEY
    env:
      HUBSPOT_ACCOUNT_ID: ${{ vars.HUBSPOT_ACCOUNT_ID }}
      HUBSPOT_PERSONAL_ACCESS_KEY: ${{ secrets.HUBSPOT_PERSONAL_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check the HubSpot key is set
        run: |
          if [ -z "$HUBSPOT_PERSONAL_ACCESS_KEY" ] || [ -z "$HUBSPOT_ACCOUNT_ID" ]; then
            echo "::error::Add the HUBSPOT_PERSONAL_ACCESS_KEY secret and HUBSPOT_ACCOUNT_ID variable to the HUBSPOT_PERSONAL_ACCESS_KEY environment"
            exit 1
          fi
      - run: npm install -g @hubspot/cli@latest
      - name: Validate
        run: hs project validate --use-env --profile prod
      - name: Upload and deploy to live
        run: hs project upload --use-env --profile prod --json --force

  deploy-sandbox:
    needs: test
    if: github.ref == 'refs/heads/sandbox' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    environment: HUBSPOT_SANDBOX
    env:
      HUBSPOT_ACCOUNT_ID: ${{ vars.HUBSPOT_ACCOUNT_ID }}
      HUBSPOT_PERSONAL_ACCESS_KEY: ${{ secrets.HUBSPOT_PERSONAL_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check the sandbox key is set
        run: |
          if [ -z "$HUBSPOT_PERSONAL_ACCESS_KEY" ] || [ "$HUBSPOT_ACCOUNT_ID" != "149841037" ]; then
            echo "::error::Add the sandbox HUBSPOT_PERSONAL_ACCESS_KEY secret and HUBSPOT_ACCOUNT_ID=149841037 variable to the HUBSPOT_SANDBOX environment"
            exit 1
          fi
      - run: npm install -g @hubspot/cli@latest
      - name: Validate
        run: hs project validate --use-env --profile sandbox
      - name: Upload and deploy to the sandbox
        run: hs project upload --use-env --profile sandbox --json --force
